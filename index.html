<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Leuchtfeuer</title>
    <script>
      // Theme and text size before first paint, so a dark app never flashes white.
      try {
        var s = JSON.parse(localStorage.getItem("router.settings.v1") || "{}");
        document.documentElement.dataset.theme = s.theme || "dark";
        if (s.textSize && s.textSize !== "normal") document.documentElement.dataset.text = s.textSize;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
